[package]
name = "tunnix"
version = "0.4.1"
edition = "2021"
rust-version = "1.96"
authors = ["Aero Wang <aero.windwalker@gmail.com>"]
license = "MIT"
repository = "https://github.com/aeroxy/tunnix"
homepage = "https://github.com/aeroxy/tunnix"
readme = "README.md"
keywords = ["proxy", "socks5", "tunnel", "encryption", "sse"]
categories = ["network-programming", "command-line-utilities"]
description = "Encrypted SOCKS5/HTTP proxy tunnel over HTTP/SSE — works through reverse proxies, Cloud Shell, Codespaces, and other HTTP-only environments."
include = [
    "src/**/*.rs",
    "Cargo.toml",
    "README.md",
    "QUICKSTART.md",
    "LICENSE",
    "config.example.toml",
]

[[bin]]
name = "tunnix"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1.40", features = ["full"] }

# Network stack (HTTP client/server, TLS, SOCKS5, protocol peeking)
rama = { version = "0.4", features = ["http-full", "rustls", "ring", "socks5"] }

# Encryption
chacha20poly1305 = "0.10"
argon2 = "0.5"
rand = "0.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

# CLI & Config
clap = { version = "4.5", features = ["derive", "env"] }
toml = "0.8"

# Error handling & logging
anyhow = "1.0"
thiserror = "1.0"

# Encoding
base64ct = { version = "1.6", features = ["alloc"] }

# File transfer (push/pull): zstd-compressed tar streams
zstd = "0.13"
tar = "0.4"

# Utilities
arc-swap = "1"
shlex = "1.3"

[target.'cfg(unix)'.dependencies]
# Remote exec (PTY) — Unix only; `mod exec` is `#[cfg(unix)]` and the server
# Exec handler rejects the message on non-unix.
libc = "0.2"
portable-pty = "0.9"
nix = { version = "0.29", features = ["fs", "term"] }
